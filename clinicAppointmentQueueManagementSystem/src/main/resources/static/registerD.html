<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ClinicQ · Add Doctor</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,400;14..32,500;14..32,600;14..32,700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <style>
        *{margin:0;padding:0;box-sizing:border-box}
        body{font-family:'Inter',sans-serif;background:#f4f9fe;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:1.5rem}
        .wrapper{width:100%;max-width:1100px;background:#fff;border-radius:40px;box-shadow:0 25px 50px -12px rgba(0,20,30,.25);display:flex;flex-wrap:wrap;overflow:hidden}
        .left{flex:1 1 38%;background:linear-gradient(145deg,#e1f0fa 0%,#c9e2f5 100%);padding:3rem 2.5rem;display:flex;flex-direction:column;justify-content:center;position:relative;min-height:400px}
        .left::after{content:'';position:absolute;bottom:0;left:0;width:100%;height:40%;background:url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 320"><path fill="%23ffffff" fill-opacity="0.25" d="M0,224L48,213.3C96,203,192,181,288,181.3C384,181,480,203,576,213.3C672,224,768,224,864,202.7C960,181,1056,139,1152,144C1248,149,1344,203,1392,229.3L1440,256L1440,320L1392,320C1344,320,1248,320,1152,320C1056,320,960,320,864,320C768,320,672,320,576,320C480,320,384,320,288,320C192,320,96,320,48,320L0,320Z"/></svg>') no-repeat bottom;background-size:cover;pointer-events:none}
        .logo-area{display:flex;align-items:center;gap:.75rem;margin-bottom:2rem;position:relative;z-index:2}
        .logo-icon{background:#1a4972;color:white;width:48px;height:48px;border-radius:16px;display:flex;align-items:center;justify-content:center;font-size:26px}
        .logo-text{font-weight:700;font-size:1.7rem;letter-spacing:-.5px;color:#0b2a44}
        .logo-text span{font-weight:400;color:#2b5a7a}
        .welcome-title{position:relative;z-index:2;margin-top:1.2rem}
        .welcome-title h1{font-size:2.4rem;font-weight:700;line-height:1.2;color:#0b2a44;margin-bottom:.75rem}
        .welcome-title p{font-size:1rem;color:#1e4a6b;max-width:340px;line-height:1.6;opacity:.85}
        .right{flex:1 1 62%;padding:2.5rem 2.8rem;display:flex;flex-direction:column;justify-content:center;background:white;overflow-y:auto}
        .header{margin-bottom:1.5rem}
        .header h2{font-size:1.8rem;font-weight:700;color:#0b2a44}
        .header p{color:#4c6f89;margin-top:.3rem;font-size:.95rem}
        .form{display:flex;flex-direction:column;gap:1rem}
        .row2{display:grid;grid-template-columns:1fr 1fr;gap:1rem}
        .grp{display:flex;flex-direction:column;gap:.3rem}
        .grp label{font-weight:600;font-size:.83rem;color:#1e405b;display:flex;align-items:center;gap:.4rem}
        .grp label i{color:#3d7aa3;font-size:.9rem}
        .ifield{display:flex;align-items:center;background:#f2f7fc;border-radius:16px;padding:.2rem 1rem;border:2px solid transparent;transition:.2s}
        .ifield:focus-within{border-color:#1f6e9c;background:white;box-shadow:0 4px 12px rgba(26,73,114,.08)}
        .ifield i{color:#658ba8;font-size:1rem;margin-right:.7rem;min-width:1rem}
        .ifield input,.ifield select{width:100%;padding:.78rem 0;border:none;background:transparent;font-size:.93rem;font-weight:500;color:#0b2a44;outline:none;font-family:'Inter',sans-serif}
        .ifield select{cursor:pointer;appearance:none}
        .ifield input::placeholder{color:#99b7cf;font-weight:400}
        .toggle{cursor:pointer;color:#7f9fb9;transition:.2s;padding:.2rem;margin-left:.2rem}
        .toggle:hover{color:#1f6e9c}
        .submit-btn{background:#0b2a44;color:white;border:none;padding:.95rem;border-radius:60px;font-weight:700;font-size:1.05rem;cursor:pointer;transition:.25s;display:flex;align-items:center;justify-content:center;gap:.6rem;margin-top:.4rem;box-shadow:0 6px 18px rgba(11,42,68,.2)}
        .submit-btn:hover{background:#154a72;transform:scale(1.01)}
        .back-link{text-align:center;margin-top:1.2rem;font-size:.92rem;color:#3a607d}
        .back-link a{color:#0b2a44;font-weight:700;text-decoration:none;margin-left:.3rem;border-bottom:2px solid transparent;transition:.2s}
        .back-link a:hover{border-bottom-color:#0b2a44}
        .alert-box{padding:.75rem 1.1rem;border-radius:10px;font-size:.88rem;font-weight:500;display:none;margin-bottom:.5rem}
        .alert-error{background:#fee2e2;color:#991b1b;border:1px solid #fca5a5}
        .alert-success{background:#d1fae5;color:#065f46;border:1px solid #6ee7b7}
        .section-label{font-size:.78rem;font-weight:700;color:#1f6e9c;text-transform:uppercase;letter-spacing:.5px;padding:.2rem 0;border-bottom:1px solid #e2eaf2;margin-top:.3rem}
        @media(max-width:820px){.wrapper{flex-direction:column;border-radius:32px}.row2{grid-template-columns:1fr}}
    </style>
</head>
<body>
<div class="wrapper">
    <div class="left">
        <div class="logo-area">
            <div class="logo-icon"><i class="fas fa-heartbeat"></i></div>
            <div class="logo-text">Clinic<span>Q</span></div>
        </div>
        <div class="welcome-title">
            <h1>Add Doctor <i style="color:#1f6e9c;font-weight:300">·</i></h1>
            <p>Create a new doctor account with login credentials and medical profile details.</p>
        </div>
    </div>

    <div class="right">
        <div class="header">
            <h2>New Doctor Account</h2>
            <p>Admin panel — fill in login credentials and doctor details.</p>
        </div>

        <div id="alertBox" class="alert-box"></div>

        <form class="form" onsubmit="handleRegister(); return false;">

            <div class="section-label"><i class="fas fa-key"></i> Login Credentials</div>
            <div class="row2">
                <div class="grp">
                    <label><i class="fas fa-user-tag"></i> Username</label>
                    <div class="ifield">
                        <i class="fas fa-user-circle"></i>
                        <input type="text" id="username" placeholder="dr_jane" required autocomplete="new-password">
                    </div>
                </div>
                <div class="grp">
                    <label><i class="fas fa-envelope"></i> Login Email</label>
                    <div class="ifield">
                        <i class="fas fa-envelope"></i>
                        <input type="email" id="userEmail" placeholder="dr.jane@clinic.com" required>
                    </div>
                </div>
            </div>
            <div class="grp">
                <label><i class="fas fa-lock"></i> Password</label>
                <div class="ifield">
                    <i class="fas fa-key"></i>
                    <input type="password" id="password" placeholder="Min 6 characters" required autocomplete="new-password">
                    <span class="toggle" id="togglePass"><i class="fas fa-eye-slash"></i></span>
                </div>
            </div>

            <div class="section-label"><i class="fas fa-user-md"></i> Doctor Profile</div>
            <div class="row2">
                <div class="grp">
                    <label><i class="fas fa-id-card"></i> First Name</label>
                    <div class="ifield"><i class="fas fa-user"></i><input type="text" id="firstName" placeholder="Jane" required></div>
                </div>
                <div class="grp">
                    <label><i class="fas fa-id-card"></i> Last Name</label>
                    <div class="ifield"><i class="fas fa-user"></i><input type="text" id="lastName" placeholder="Doe" required></div>
                </div>
            </div>
            <div class="row2">
                <div class="grp">
                    <label><i class="fas fa-stethoscope"></i> Specialization</label>
                    <div class="ifield">
                        <i class="fas fa-stethoscope"></i>
                        <select id="specializationId" required>
                            <option value="" disabled selected>Loading...</option>
                        </select>
                    </div>
                </div>
                <div class="grp">
                    <label><i class="fas fa-id-badge"></i> License Number</label>
                    <div class="ifield"><i class="fas fa-id-badge"></i><input type="text" id="licenseNumber" placeholder="LIC-12345"></div>
                </div>
            </div>
            <div class="row2">
                <div class="grp">
                    <label><i class="fas fa-phone"></i> Phone</label>
                    <div class="ifield"><i class="fas fa-mobile-alt"></i><input type="text" id="phoneNumber" placeholder="077 123 4567"></div>
                </div>
                <div class="grp">
                    <label><i class="fas fa-envelope"></i> Contact Email</label>
                    <div class="ifield"><i class="fas fa-at"></i><input type="email" id="email" placeholder="contact@clinic.com"></div>
                </div>
            </div>

            <button type="submit" class="submit-btn" id="submitBtn">
                <i class="fas fa-user-plus"></i> Add Doctor
            </button>

            <div class="back-link">Back to <a href="doctors.html">Doctors list</a></div>
        </form>
    </div>
</div>

<script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
<script>
    const API     = 'http://localhost:8080';
    const token   = () => localStorage.getItem('token');
    const authHdr = () => ({ 'Authorization': 'Bearer ' + token() });

    document.getElementById('togglePass').addEventListener('click', function () {
        const p = document.getElementById('password');
        const isPass = p.type === 'password';
        p.type = isPass ? 'text' : 'password';
        this.innerHTML = isPass ? '<i class="fas fa-eye"></i>' : '<i class="fas fa-eye-slash"></i>';
    });

    function showAlert(msg, type) {
        const box = document.getElementById('alertBox');
        box.textContent = msg;
        box.className = 'alert-box ' + (type === 'success' ? 'alert-success' : 'alert-error');
        box.style.display = 'block';
        setTimeout(() => box.style.display = 'none', 4500);
    }

    $(document).ready(function () {
        if (!token()) { window.location.href = 'login.html'; return; }
        loadSpecializations();
    });

    function loadSpecializations() {
        $.ajax({
            url: API + '/api/specializations/getAllSpecializations',
            method: 'GET',
            headers: authHdr(),
            success: function (res) {
                const sel = $('#specializationId');
                sel.empty().append('<option value="" disabled selected>Select Specialization</option>');
                (res.body || []).forEach(s => sel.append(`<option value="${s.specializationId}">${s.name}</option>`));
            },
            error: function () { showAlert('Failed to load specializations.', 'error'); }
        });
    }

    function handleRegister() {
        const username  = $('#username').val().trim();
        const userEmail = $('#userEmail').val().trim();
        const password  = $('#password').val().trim();
        const firstName = $('#firstName').val().trim();
        const lastName  = $('#lastName').val().trim();
        const specId    = $('#specializationId').val();

        if (!username || !userEmail || !password || !firstName || !lastName || !specId) {
            showAlert('Please fill in all required fields.', 'error'); return;
        }

        const btn = document.getElementById('submitBtn');
        btn.disabled = true;
        btn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Adding...';

        $.ajax({
            url: API + '/api/doctors/addDct',
            method: 'POST',
            contentType: 'application/json',
            headers: authHdr(),
            data: JSON.stringify({
                username:         username,
                userEmail:        userEmail,
                password:         password,
                firstName:        firstName,
                lastName:         lastName,
                specializationId: specId,
                licenseNumber:    $('#licenseNumber').val().trim(),
                phoneNumber:      $('#phoneNumber').val().trim(),
                email:            $('#email').val().trim()
            }),
            success: function (res) {
                if (res.status === 0) {
                    showAlert('Doctor added successfully! Redirecting...', 'success');
                    setTimeout(() => window.location.href = 'doctors.html', 1800);
                } else {
                    showAlert(res.message || 'Failed to add doctor.', 'error');
                    btn.disabled = false;
                    btn.innerHTML = '<i class="fas fa-user-plus"></i> Add Doctor';
                }
            },
            error: function (xhr) {
                let msg = 'Error adding doctor.';
                try { msg = JSON.parse(xhr.responseText).message || msg; } catch(e){}
                showAlert(msg, 'error');
                btn.disabled = false;
                btn.innerHTML = '<i class="fas fa-user-plus"></i> Add Doctor';
            }
        });
    }
</script>
</body>
</html>
