<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ClinicQ - Patients</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <link rel="stylesheet" href="css/style.css">
    <script src="js/sidebar.js" defer></script>
</head>
<body>
<div class="app-shell">

    <!-- ── Sidebar ──────────────────────────────────────────────────────── -->
    <aside class="sidebar" id="sidebar">
        <div class="logo-area" style="margin-bottom:1.2rem;">
            <div class="logo-icon"><i class="fas fa-heartbeat"></i></div>
            <div class="logo-text" style="color:white;">Clinic<span>Q</span></div>
        </div>
        <!-- nav built by sidebar.js based on role -->
    </aside>

    <!-- ── Main ─────────────────────────────────────────────────────────── -->
    <div class="content">

        <!-- Topbar -->
        <header class="topbar">
            <button class="menu-btn" type="button"
                    onclick="document.getElementById('sidebar').classList.toggle('open')">
                <i class="fas fa-bars"></i>
            </button>
            <h2>Patients</h2>
            <div id="who" style="font-size:.9rem;color:#64748b;font-weight:600"></div>
        </header>

        <main class="page">
            <div id="alert" class="alert alert-error" style="display:none;"></div>

            <!-- ── Form card ──────────────────────────────────────────── -->
            <div class="card">
                <h3 id="formTitle"
                    style="margin-bottom:1rem;color:#0b2a44;font-size:1rem">
                    Add New Patient
                </h3>

                <form id="patientForm" class="form-grid">
                    <input type="hidden" id="patientId">
                    <input type="hidden" id="userId">

                    <!-- search bar spans full width -->
                    <div style="grid-column:1/-1;margin-bottom:.2rem;">
                        <input type="text" id="searchInput"
                               placeholder="&#xf002;  Search by name or phone…"
                               class="field-input"
                               style="width:100%;">
                    </div>

                    <!-- personal details -->
                    <input class="field-input" id="firstName"
                           placeholder="First name" required>
                    <input class="field-input" id="lastName"
                           placeholder="Last name"  required>
                    <input class="field-input" id="age"
                           type="number" placeholder="Age" min="0" max="150">
                    <select class="field-input" id="gender">
                        <option value="MALE">Male</option>
                        <option value="FEMALE">Female</option>
                        <option value="OTHER">Other</option>
                    </select>
                    <input class="field-input" id="contact"
                           placeholder="Phone number">
                    <input class="field-input" id="address"
                           placeholder="Address">
                    <input class="field-input" id="emergencyContact"
                           placeholder="Emergency contact">

                    <!-- optional login account -->
                    <fieldset style="grid-column:1/-1;border:1px solid #e2eaf2;
                                     border-radius:10px;padding:.8rem 1rem;margin-top:.3rem">
                        <legend style="font-size:.78rem;font-weight:700;
                                       color:#1f6e9c;padding:0 .4rem">
                            Login Account (optional — for patient self-login)
                        </legend>
                        <div class="form-grid" style="margin-top:.5rem">
                            <input class="field-input" id="username"
                                   placeholder="Username"
                                   autocomplete="new-password">
                            <input class="field-input" id="userEmail"
                                   placeholder="Email" type="email">
                            <input class="field-input" id="password"
                                   placeholder="Password" type="password"
                                   autocomplete="new-password">
                        </div>
                    </fieldset>

                    <!-- action buttons -->
                    <div style="grid-column:1/-1;display:flex;gap:.7rem;
                                flex-wrap:wrap;margin-top:.6rem">
                        <button class="btn" type="button"
                                onclick="savePatient()">
                            <i class="fas fa-plus"></i> Save Patient
                        </button>
                        <button class="btn btn-secondary" type="button"
                                onclick="handlePatientUpdate()">
                            <i class="fas fa-pen"></i> Update Patient
                        </button>
                        <button class="btn btn-secondary" type="button"
                                onclick="handleDelete()">
                            <i class="fas fa-trash"></i> Delete Patient
                        </button>
                        <button class="btn btn-secondary" type="button"
                                onclick="clearForm()">
                            <i class="fas fa-times"></i> Clear
                        </button>
                    </div>
                </form>

                <!-- ── Table ───────────────────────────────────────── -->
                <div class="table-wrap" style="margin-top:1.5rem">
                    <table>
                        <thead>
                        <tr>
                            <th>ID</th>
                            <th>Name</th>
                            <th>Phone</th>
                            <th>Age</th>
                            <th>Gender</th>
                            <th>Address</th>
                            <th>Emergency Contact</th>
                            <th>Email</th>
                            <th>Status</th>
                        </tr>
                        </thead>
                        <tbody id="patientTable">
                        <tr>
                            <td colspan="9"
                                style="text-align:center;color:#94a3b8;padding:1.5rem">
                                Loading patients…
                            </td>
                        </tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </main>
    </div>
</div>

<script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
<script>
    const API     = 'http://localhost:8080';
    const token   = () => localStorage.getItem('token');
    const authHdr = () => ({ 'Authorization': 'Bearer ' + token() });

    $(document).ready(function () {
        if (!token()) { window.location.href = 'login.html'; return; }
        const uname = localStorage.getItem('username') || '';
        if (uname) document.getElementById('who').textContent = 'Logged in as: ' + uname;

        loadPatients();

        $('#searchInput').on('input', function () {
            const kw = $(this).val().trim();
            if (kw.length > 0) searchPatients(kw);
            else loadPatients();
        });
    });

    function logout() { localStorage.clear(); window.location.href = 'login.html'; }

    function showAlert(msg, type) {
        const el = document.getElementById('alert');
        el.textContent   = msg;
        el.className     = 'alert ' + (type === 'success' ? '' : 'alert-error');
        el.style.display = 'block';
        setTimeout(() => el.style.display = 'none', 4000);
    }

    function clearForm() {
        document.getElementById('patientForm').reset();
        document.getElementById('patientId').value = '';
        document.getElementById('userId').value    = '';
        document.getElementById('formTitle').textContent = 'Add New Patient';
    }

    function loadPatients() {
        $.ajax({
            url:     API + '/api/patients/allPatients',
            method:  'GET',
            headers: authHdr(),
            success: function (res) {
                renderTable(res.body || []);
            },
            error: function (xhr) {
                if (xhr.status === 401 || xhr.status === 403) { logout(); return; }
                showAlert('Failed to load patients.', 'error');
            }
        });
    }

    function searchPatients(keyword) {
        $.ajax({
            url:     API + '/api/patients/searchPatients?keyword=' + encodeURIComponent(keyword),
            method:  'GET',
            headers: authHdr(),
            success: function (res) { renderTable(res.body || []); },
            error:   function ()    { showAlert('Search failed.', 'error'); }
        });
    }

    function renderTable(patients) {
        const tbody = $('#patientTable');
        tbody.empty();
        if (patients.length === 0) {
            tbody.append('<tr><td colspan="9" style="text-align:center;color:#94a3b8;padding:1.5rem">No patients found</td></tr>');
            return;
        }
        patients.forEach(p => {
            const statusBadge = p.status === 'ACTIVE'
                ? '<span style="color:#16a34a;font-weight:600;font-size:.8rem">● Active</span>'
                : '<span style="color:#dc2626;font-weight:600;font-size:.8rem">● Inactive</span>';
            const row = $(`
                <tr style="cursor:pointer">
                    <td>${p.patientId}</td>
                    <td><strong>${p.firstName} ${p.lastName}</strong></td>
                    <td>${p.contact || '—'}</td>
                    <td>${p.age || '—'}</td>
                    <td>${p.gender || '—'}</td>
                    <td>${p.address || '—'}</td>
                    <td>${p.emergencyContact || '—'}</td>
                    <td>${p.userEmail || '—'}</td>
                    <td>${statusBadge}</td>
                </tr>
            `);
            row.on('click', function () {
                $('#patientId').val(p.patientId);
                $('#userId').val(p.userId || '');
                $('#firstName').val(p.firstName);
                $('#lastName').val(p.lastName);
                $('#age').val(p.age);
                $('#gender').val(p.gender);
                $('#contact').val(p.contact);
                $('#address').val(p.address);
                $('#emergencyContact').val(p.emergencyContact);
                $('#username').val('');
                $('#userEmail').val(p.userEmail || '');
                $('#password').val('');
                document.getElementById('formTitle').textContent =
                    'Edit Patient — ' + p.firstName + ' ' + p.lastName;
            });
            tbody.append(row);
        });
    }

    function savePatient() {
        const firstName = $('#firstName').val().trim();
        const lastName  = $('#lastName').val().trim();
        if (!firstName || !lastName) {
            showAlert('First name and last name are required.', 'error'); return;
        }

        const payload = {
            firstName:        firstName,
            lastName:         lastName,
            age:              $('#age').val() ? parseInt($('#age').val()) : null,
            gender:           $('#gender').val(),
            contact:          $('#contact').val().trim(),
            address:          $('#address').val().trim(),
            emergencyContact: $('#emergencyContact').val().trim(),
            username:         $('#username').val().trim() || null,
            userEmail:        $('#userEmail').val().trim() || null,
            password:         $('#password').val().trim() || null
        };

        $.ajax({
            url:         API + '/api/patients/savePatient',
            method:      'POST',
            contentType: 'application/json',
            headers:     authHdr(),
            data:        JSON.stringify(payload),
            success: function (res) {
                if (res.status === 0) {
                    showAlert('Patient saved successfully!', 'success');
                    clearForm();
                    loadPatients();
                } else {
                    showAlert(res.message || 'Failed to save patient.', 'error');
                }
            },
            error: function (xhr) {
                let msg = 'Error saving patient.';
                try { msg = JSON.parse(xhr.responseText).message || msg; } catch(e){}
                showAlert(msg, 'error');
            }
        });
    }

    function handlePatientUpdate() {
        const patientId = $('#patientId').val().trim();
        if (!patientId) {
            showAlert('Please select a patient from the table first.', 'error'); return;
        }

        const payload = {
            patientId:        patientId,
            firstName:        $('#firstName').val().trim(),
            lastName:         $('#lastName').val().trim(),
            age:              $('#age').val() ? parseInt($('#age').val()) : null,
            gender:           $('#gender').val(),
            contact:          $('#contact').val().trim(),
            address:          $('#address').val().trim(),
            emergencyContact: $('#emergencyContact').val().trim()
        };

        $.ajax({
            url:         API + '/api/patients/updatePatient',
            method:      'PUT',
            contentType: 'application/json',
            headers:     authHdr(),
            data:        JSON.stringify(payload),
            success: function (res) {
                if (res.status === 0) {
                    showAlert('Patient updated successfully!', 'success');
                    clearForm();
                    loadPatients();
                } else {
                    showAlert(res.message || 'Failed to update.', 'error');
                }
            },
            error: function (xhr) {
                let msg = 'Error updating patient.';
                try { msg = JSON.parse(xhr.responseText).message || msg; } catch(e){}
                showAlert(msg, 'error');
            }
        });
    }

    function handleDelete() {
        const patientId = $('#patientId').val().trim();
        if (!patientId) {
            showAlert('Please select a patient from the table first.', 'error'); return;
        }
        if (!confirm('Soft-delete this patient? (status → INACTIVE)')) return;

        $.ajax({
            url:     API + '/api/patients/deletePatient/' + patientId,
            method:  'DELETE',
            headers: authHdr(),
            success: function (res) {
                if (res.status === 0) {
                    showAlert('Patient deleted (set inactive).', 'success');
                    clearForm();
                    loadPatients();
                } else {
                    showAlert(res.message || 'Failed to delete.', 'error');
                }
            },
            error: function (xhr) {
                let msg = 'Error deleting patient.';
                try { msg = JSON.parse(xhr.responseText).message || msg; } catch(e){}
                showAlert(msg, 'error');
            }
        });
    }
</script>
</body>
</html>
