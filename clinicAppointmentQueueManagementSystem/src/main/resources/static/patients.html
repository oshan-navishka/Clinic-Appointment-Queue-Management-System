<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ClinicQ - Patients</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
<div class="app-shell">
    <aside class="sidebar" id="sidebar">
        <div class="logo-area" style="margin-bottom:1.2rem;">
            <div class="logo-icon"><i class="fas fa-heartbeat"></i></div>
            <div class="logo-text" style="color:white;">Clinic<span>Q</span></div>
        </div>
        <a class="staff-only" href="dashboard.html"><i class="fas fa-gauge-high"></i> Dashboard</a>
        <a class="staff-only active" href="patients.html"><i class="fas fa-user-injured"></i> Patients</a>
        <a class="" href="doctors.html"><i class="fas fa-user-doctor"></i> Doctors</a>
        <a class="" href="specializations.html"><i class="fas fa-stethoscope"></i> Specializations</a>
        <a class="" href="clinic-branches.html"><i class="fas fa-hospital"></i> Branches</a>
        <a class="staff-only" href="doctor-schedules.html"><i class="fas fa-clock"></i> Schedules</a>
        <a class="staff-only" href="appointments.html"><i class="fas fa-calendar-check"></i> Appointments</a>
        <a class="staff-only" href="queues.html"><i class="fas fa-list-ol"></i> Queue</a>
        <a class="staff-only" href="medical-records.html"><i class="fas fa-notes-medical"></i> Records</a>
        <a class="staff-only" href="prescriptions.html"><i class="fas fa-prescription"></i> Prescriptions</a>
        <a class="staff-only" href="medications.html"><i class="fas fa-pills"></i> Medications</a>
        <a class="staff-only" href="payments.html"><i class="fas fa-credit-card"></i> Payments</a>
        <a class="staff-only" href="invoices.html"><i class="fas fa-file-invoice"></i> Invoices</a>
        <a class="staff-only" href="notifications.html"><i class="fas fa-bell"></i> Notifications</a>
        <a class="staff-only" href="doctor-reviews.html"><i class="fas fa-star"></i> Reviews</a>
        <a class="admin-only" href="users.html"><i class="fas fa-users-gear"></i> Users</a>
        <a class="admin-only" href="audit-logs.html"><i class="fas fa-clipboard-list"></i> Audit logs</a>
        <a href="#" onclick="logout(); return false;"><i class="fas fa-right-from-bracket"></i> Logout</a>
    </aside>
    <div class="content">
        <header class="topbar">
            <button class="menu-btn" type="button" onclick="document.getElementById('sidebar').classList.toggle('open')"><i class="fas fa-bars"></i></button>
            <h2>Patients</h2>
            <div id="who"></div>
        </header>
        <main class="page">
            <div id="alert" class="alert alert-error" style="display:none;"></div>
            <div class="card">
                <form id="patientForm" class="form-grid"">
<!--                    <select class="field-input" id="userId" required>-->
<!--                        <option value="" disabled selected>Select User Account</option>-->
<!--                    </select>-->

                    <div>
                        <label>User ID</label>

                        <input
                                class="field-input"
                                id="userIdDisplay"
                                type="text"
                                readonly
                                placeholder="Logged User ID"
                        >

                        <input
                                id="userId"
                                type="hidden"
                        >
                    </div>

                    <input class="field-input" id="firstName" placeholder="First name" required>
                    <input type="hidden" id="patientId">
                    <input class="field-input" id="lastName" placeholder="Last name" required>
                    <input class="field-input" id="age" type="number" placeholder="Age">
                    <select class="field-input" id="gender"><option>MALE</option><option>FEMALE</option><option>OTHER</option></select>
                    <input class="field-input" id="contact" placeholder="Phone">
                    <input class="field-input" id="address" placeholder="Address">
                    <input class="field-input" id="emergencyContact" placeholder="Emergency contact">
                    <button class="btn" type="button" onclick="saveCustomer()">Save patient</button>
                    <button class="btn" type="button" onclick="handlePatientUpdate()">Update patient</button>
                </form>
                <div class="table-wrap" style="margin-top:1rem;">
                    <table>
                        <thead><tr><th>ID</th><th>Name</th><th>Phone</th><th>Age</th><th>Address</th><th>Emergency contact</th><th>Status</th></tr></thead>
                        <tbody id="patientTable"></tbody>
                    </table>
                </div>
            </div>
        </main>
    </div>
</div>
</body>
<script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>

<script>
    $(document).ready(function () {

        const userId = localStorage.getItem("userId");

        console.log("Patient Page User ID:", userId);

        if (userId) {

            $("#userIdDisplay").val(userId);
            $("#userId").val(userId);

        } else {

            console.log("NO USER ID FOUND");

            $("#userIdDisplay").val("User ID not found");
            $("#userId").val("");
        }
        loadPatients();

    });

    function saveCustomer(){
        const userId = $("#userId").val().trim();
        const firstName = $("#firstName").val().trim();
        const lastName = $("#lastName").val().trim();
        const age = $("#age").val().trim();
        const gender = $("#gender").val().trim();
        const contact = $("#contact").val().trim();
        const address = $("#address").val().trim();
        const emergencyContact = $("#emergencyContact").val().trim();

        $.ajax({
            url: "http://localhost:8080/api/patients/savePatient",
            method: "POST",
            contentType: "application/json",
            data: JSON.stringify({
                userId: userId,
                firstName: firstName,
                lastName: lastName,
                age: age,
                gender: gender,
                contact: contact,
                address: address,
                emergencyContact: emergencyContact
            }),
            success: function (response) {
                console.log("Patient saved successfully:", response);
                alert("Patient saved successfully!");
                $("#patientForm")[0].reset();
                $("#userIdDisplay").val(userId);
                $("#userId").val(userId);
                loadPatients();
            },
            error: function (xhr, status, error) {
                console.error("Error saving patient:", error);
                alert("Error saving patient: " + error);
            }
        })
    }

    function handlePatientUpdate(){
        const patientId = $("#patientId").val().trim();
        const firstName = $("#firstName").val().trim();
        const lastName = $("#lastName").val().trim();
        const age = $("#age").val().trim();
        const gender = $("#gender").val().trim();
        const contact = $("#contact").val().trim();
        const address = $("#address").val().trim();
        const emergencyContact = $("#emergencyContact").val().trim();

        $.ajax({
            url: "http://localhost:8080/api/patients/updatePatient",
            method: "PUT",
            contentType: "application/json",
            data: JSON.stringify({
                patientId: patientId,
                firstName: firstName,
                lastName: lastName,
                age: age,
                gender: gender,
                contact: contact,
                address: address,
                emergencyContact: emergencyContact
            }),
            success: function (response) {
                console.log("Patient updated successfully:", response);
                alert("Patient updated successfully!");
                $("#patientForm")[0].reset();
                loadPatients();
            },
            error: function (xhr, status, error) {
                console.error("Error updating patient:", error);
                alert("Error updating patient: " + error);
            }
        });
    }

    function loadPatients(){
        $.ajax({
            url: "http://localhost:8080/api/patients/allPatients",
            method: "GET",
            headers: {
                "Authorization": "Bearer " + localStorage.getItem("token")
            },
            success: function (response) {

                const tbody = $("#patientTable");
                tbody.empty();
                response.body.forEach(patient => {
                    const row = $(`
                        <tr>
                            <td>${patient.patientId}</td>
                            <td>${patient.firstName} ${patient.lastName}</td>
                            <td>${patient.contact}</td>
                            <td>${patient.age}</td>
                            <td>${patient.address}</td>
                            <td>${patient.emergencyContact}</td>
                            <td>${patient.status}</td>
                        </tr>
                    `);
                    row.on("click", function(){
                        $("#patientId").val(patient.patientId);
                        $("#userId").val(patient.userId);
                        $("#firstName").val(patient.firstName);
                        $("#lastName").val(patient.lastName);
                        $("#age").val(patient.age);
                        $("#gender").val(patient.gender);
                        $("#contact").val(patient.contact);
                        $("#address").val(patient.address);
                        $("#emergencyContact").val(patient.emergencyContact);
                        $("#status").val(patient.status);
                    });
                    tbody.append(row);
                });
            },
            error: function (xhr, status, error) {
                console.error("Error fetching patients:", error);
                alert("Error fetching patients: " + error);
            }
        })
    }
</script>

</html>
