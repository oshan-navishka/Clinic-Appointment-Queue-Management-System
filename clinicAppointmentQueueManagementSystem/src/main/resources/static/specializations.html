<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ClinicQ - Specializations</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <link rel="stylesheet" href="css/style.css">
    <script src="js/sidebar.js" defer></script>
</head>
<body>
<div class="app-shell">
    <aside class="sidebar" id="sidebar">
        <div class="logo-area">
            <div class="logo-icon"><i class="fas fa-heartbeat"></i></div>
            <div class="logo-text" style="color:white">Clinic<span>Q</span></div>
        </div>
        <!-- nav built by sidebar.js based on role -->
    </aside>
    <div class="content">
        <header class="topbar">
            <button class="menu-btn" type="button" onclick="document.getElementById('sidebar').classList.toggle('open')"><i class="fas fa-bars"></i></button>
            <h2>Specializations</h2>
            <div id="who"></div>
        </header>
        <main class="page">
            <div id="alert" class="alert alert-error" style="display:none;"></div>
            <div class="card">
                <form id="specForm" class="form-grid admin-only">
                    <input type="hidden" id="id">
                    <input class="field-input" id="name" placeholder="Name" required>
                    <input class="field-input" id="description" placeholder="Description">
                    <input type="hidden" id="status">
                    <button class="btn" type="button" onclick="saveSpecialization()">Save</button>
                    <button class="btn" type="button" onclick="handleUpdateSpecialization()">Update</button>
                    <button class="btn" type="button" onclick="handleDeleteSpecialization()">Delete</button>
                </form>
                <div class="table-wrap" style="margin-top:1rem;">
                    <table>
                        <thead><tr><th>ID</th><th>Name</th><th>Status</th></tr></thead>
                        <tbody id="specTable"></tbody>
                    </table>
                </div>
            </div>
        </main>
    </div>
</div>

<script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
<script>
    $(document).ready(function() {
        if (!localStorage.getItem('token')) { window.location.href = 'login.html'; return; }
        const uname = localStorage.getItem('username') || '';
        if (uname) document.getElementById('who').textContent = 'Logged in as: ' + uname;
        loadSpecializations();
    });

    function logout() { localStorage.clear(); window.location.href = 'login.html'; }

    function saveSpecialization(){
        const data = {
            name: document.getElementById("name").value.trim(),
            description: document.getElementById("description").value.trim()
        };
        $.ajax({
            url: "http://localhost:8080/api/specializations/saveSpecialization",
            type: "POST",
            contentType: "application/json",
            data: JSON.stringify(data),
            headers: {
                "Authorization": "Bearer " + localStorage.getItem("token")
            },
            success: function (response) {
                alert("Specialization saved successfully!");
                console.log("Specialization saved:", response);
                $("#specForm")[0].reset();
                loadSpecializations();
            },
            error: function (xhr, status, error) {
                alert("Error saving specialization: " + xhr.responseText);
            }
        })
    }
    function loadSpecializations(){
        $.ajax({
            url: "http://localhost:8080/api/specializations/getAllSpecializations",
            type: "GET",
            headers: {
                "Authorization": "Bearer " + localStorage.getItem("token")
            },
            success: function (response){
                const tbody = $("#specTable");
                tbody.empty();
                response.body.forEach(specialization => {
                    const row = $(`
                        <tr>
                            <td>${specialization.specializationId}</td>
                            <td>${specialization.name}</td>
                            <td>${specialization.status}</td>
                        </tr>
                    `);
                    row.on("click", function () {
                        $("#id").val(specialization.specializationId);
                        $("#name").val(specialization.name);
                        $("#description").val(specialization.description);
                        $("#status").val(specialization.status);
                    });
                    tbody.append(row);
                });
            },
            error: function (response){
                alert("Error fetching specializations:");
                console.error("Error fetching specializations:", response);
            }
        });
    }

    function handleUpdateSpecialization() {
        const specializationId = $("#id").val().trim();
        const data = {
            specializationId: specializationId,
            name: $("#name").val().trim(),
            description: $("#description").val().trim(),
            status: $("#status").val().trim()
        };
        $.ajax({
            url: `http://localhost:8080/api/specializations/updateSpecialization`,
            type: "PUT",
            contentType: "application/json",
            data: JSON.stringify(data),
            headers: {
                "Authorization": "Bearer " + localStorage.getItem("token")
            },
            success: function (response) {
                alert("Specialization updated successfully!");
                console.log("Specialization updated:", response);
                loadSpecializations();
            },
            error: function (xhr, status, error) {
                alert("Error updating specialization: " + xhr.responseText);
                console.error("Error updating specialization:", error);
            }
        });
    }

    function handleDeleteSpecialization(){
        const specializationId = $("#id").val().trim();
        if (!specializationId) {
            alert("Please select a specialization to delete.");
            return;
        }
        $.ajax({
            url: `http://localhost:8080/api/specializations/deleteSpecialization/${specializationId}`,
            type: "DELETE",
            headers: {
                "Authorization": "Bearer " + localStorage.getItem("token")
            },
            success: function (response) {
                alert("Specialization deleted successfully!");
                console.log("Specialization deleted:", response);
                $("#specForm")[0].reset();
                loadSpecializations();
            },
            error: function (xhr, status, error) {
                alert("Error deleting specialization: " + xhr.responseText);
                console.error("Error deleting specialization:", error);
            }
        });
    }
</script>
</body>
</html>
