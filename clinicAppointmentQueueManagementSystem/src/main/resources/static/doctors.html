<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ClinicQ - Doctors</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <link rel="stylesheet" href="css/style.css">
    <script src="js/sidebar.js" defer></script>
</head>
<body>
<div class="app-shell">
    <aside class="sidebar" id="sidebar">
        <div class="logo-area">
            <div class="logo-icon"><i class="fas fa-heartbeat"></i></div>
            <div class="logo-text" style="color:white">Clinic<span>Q</span></div>
        </div>
        <!-- nav built by sidebar.js based on role -->
    </aside>

    <div class="content">
        <header class="topbar">
            <button class="menu-btn" type="button" onclick="document.getElementById('sidebar').classList.toggle('open')"><i class="fas fa-bars"></i></button>
            <h2>Doctors</h2>
            <div id="who"></div>
        </header>

        <main class="page">
            <div id="alert" class="alert alert-error" style="display:none;"></div>

            <div class="card">
                <h3 style="margin-bottom:1rem;color:#0b2a44;font-size:1rem" id="formTitle">Add New Doctor</h3>
                <form id="doctorForm" class="form-grid">
                    <input type="hidden" id="doctorId">

                    <!-- Login credentials (required when adding) -->
                    <fieldset style="grid-column:1/-1;border:1px solid #e2eaf2;border-radius:10px;padding:.8rem 1rem;margin-bottom:.3rem">
                        <legend style="font-size:.82rem;font-weight:700;color:#1f6e9c;padding:0 .4rem">Login Credentials (required for new doctor)</legend>
                        <div class="form-grid" style="margin-top:.5rem">
                            <input class="field-input" id="username"  placeholder="Username" autocomplete="new-password">
                            <input class="field-input" id="userEmail" placeholder="Login Email" type="email">
                            <input class="field-input" id="password"  placeholder="Password" type="password" autocomplete="new-password">
                        </div>
                    </fieldset>

                    <!-- Doctor profile -->
                    <input class="field-input" id="firstName"     placeholder="First name" required>
                    <input class="field-input" id="lastName"      placeholder="Last name"  required>
                    <select class="field-input" id="specializationId" required>
                        <option value="" disabled selected>Select Specialization</option>
                    </select>
                    <input class="field-input" id="licenseNumber" placeholder="License number">
                    <input class="field-input" id="phoneNumber"   placeholder="Phone">
                    <input class="field-input" id="email"         placeholder="Contact Email">

                    <div style="grid-column:1/-1;display:flex;gap:.7rem;flex-wrap:wrap;margin-top:.4rem">
                        <button class="btn" type="button" onclick="handleDoctorSave()"><i class="fas fa-plus"></i> Add Doctor</button>
                        <button class="btn btn-secondary" type="button" onclick="handleDoctorUpdate()"><i class="fas fa-pen"></i> Update Doctor</button>
                        <button class="btn btn-secondary" type="button" onclick="clearForm()"><i class="fas fa-times"></i> Clear</button>
                    </div>
                </form>

                <div class="table-wrap" style="margin-top:1.5rem">
                    <table>
                        <thead>
                        <tr><th>ID</th><th>Name</th><th>License</th><th>Specialization</th><th>Phone</th><th>Email</th><th>Status</th></tr>
                        </thead>
                        <tbody id="doctorTable"></tbody>
                    </table>
                </div>
            </div>
        </main>
    </div>
</div>

<script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
<script>
    const API     = 'http://localhost:8080';
    const token   = () => localStorage.getItem('token');
    const authHdr = () => ({ 'Authorization': 'Bearer ' + token() });

    function logout() { localStorage.clear(); window.location.href = 'login.html'; }

    function showAlert(msg, type) {
        const el = document.getElementById('alert');
        el.textContent  = msg;
        el.className    = 'alert ' + (type === 'success' ? '' : 'alert-error');
        el.style.display = 'block';
        setTimeout(() => el.style.display = 'none', 4000);
    }

    $(document).ready(function () {
        if (!token()) { window.location.href = 'login.html'; return; }
        loadSpecializationsDropdown();
        loadDoctorsTable();
    });

    function clearForm() {
        $('#doctorForm')[0].reset();
        $('#doctorId').val('');
        document.getElementById('formTitle').textContent = 'Add New Doctor';
    }

    function handleDoctorSave() {
        const username  = $('#username').val().trim();
        const userEmail = $('#userEmail').val().trim();
        const password  = $('#password').val().trim();
        const firstName = $('#firstName').val().trim();
        const lastName  = $('#lastName').val().trim();
        const specId    = $('#specializationId').val();

        if (!firstName || !lastName || !specId) {
            showAlert('First name, last name, and specialization are required.', 'error'); return;
        }
        if (!username || !password) {
            showAlert('Username and password are required to create a doctor account.', 'error'); return;
        }

        const data = {
            username:        username,
            userEmail:       userEmail,
            password:        password,
            firstName:       firstName,
            lastName:        lastName,
            specializationId: specId,
            licenseNumber:   $('#licenseNumber').val().trim(),
            phoneNumber:     $('#phoneNumber').val().trim(),
            email:           $('#email').val().trim()
        };

        $.ajax({
            url: API + '/api/doctors/addDct',
            method: 'POST',
            contentType: 'application/json',
            headers: authHdr(),
            data: JSON.stringify(data),
            success: function (res) {
                if (res.status === 0) {
                    showAlert('Doctor added successfully!', 'success');
                    clearForm();
                    loadDoctorsTable();
                } else {
                    showAlert(res.message || 'Failed to add doctor.', 'error');
                }
            },
            error: function (xhr) {
                let msg = 'Error adding doctor.';
                try { msg = JSON.parse(xhr.responseText).message || msg; } catch(e){}
                showAlert(msg, 'error');
            }
        });
    }

    function handleDoctorUpdate() {
        const doctorId = $('#doctorId').val().trim();
        if (!doctorId) { showAlert('Please select a doctor from the table first.', 'error'); return; }

        const data = {
            doctorId:        doctorId,
            firstName:       $('#firstName').val().trim(),
            lastName:        $('#lastName').val().trim(),
            specializationId: $('#specializationId').val(),
            licenseNumber:   $('#licenseNumber').val().trim(),
            phoneNumber:     $('#phoneNumber').val().trim(),
            email:           $('#email').val().trim()
        };

        $.ajax({
            url: API + '/api/doctors/updateDoctor',
            method: 'PUT',
            contentType: 'application/json',
            headers: authHdr(),
            data: JSON.stringify(data),
            success: function (res) {
                if (res.status === 0) {
                    showAlert('Doctor updated successfully!', 'success');
                    clearForm();
                    loadDoctorsTable();
                } else {
                    showAlert(res.message || 'Failed to update doctor.', 'error');
                }
            },
            error: function (xhr) {
                let msg = 'Error updating doctor.';
                try { msg = JSON.parse(xhr.responseText).message || msg; } catch(e){}
                showAlert(msg, 'error');
            }
        });
    }

    function loadDoctorsTable() {
        $.ajax({
            url: API + '/api/doctors/loadAllDct',
            method: 'GET',
            headers: authHdr(),
            success: function (res) {
                const tbody = $('#doctorTable');
                tbody.empty();
                const list = res.body || [];
                if (list.length === 0) {
                    tbody.append('<tr><td colspan="7" style="text-align:center;color:#94a3b8;padding:1.5rem">No doctors found</td></tr>');
                    return;
                }
                list.forEach(d => {
                    const row = $(`
                        <tr style="cursor:pointer">
                            <td>${d.doctorId}</td>
                            <td><strong>${d.firstName} ${d.lastName}</strong></td>
                            <td>${d.licenseNumber || '—'}</td>
                            <td>${d.specializationName || '—'}</td>
                            <td>${d.phoneNumber || '—'}</td>
                            <td>${d.email || '—'}</td>
                            <td>${d.status || '—'}</td>
                        </tr>
                    `);
                    row.on('click', function () {
                        $('#doctorId').val(d.doctorId);
                        $('#firstName').val(d.firstName);
                        $('#lastName').val(d.lastName);
                        $('#specializationId').val(d.specializationId);
                        $('#licenseNumber').val(d.licenseNumber);
                        $('#phoneNumber').val(d.phoneNumber);
                        $('#email').val(d.email);
                        $('#username').val('');
                        $('#userEmail').val('');
                        $('#password').val('');
                        document.getElementById('formTitle').textContent = 'Edit Doctor — ' + d.firstName + ' ' + d.lastName;
                    });
                    tbody.append(row);
                });
            },
            error: function () { showAlert('Failed to load doctors.', 'error'); }
        });
    }

    function loadSpecializationsDropdown() {
        $.ajax({
            url: API + '/api/specializations/getAllSpecializations',
            method: 'GET',
            headers: authHdr(),
            success: function (res) {
                const sel = $('#specializationId');
                sel.empty().append('<option value="" disabled selected>Select Specialization</option>');
                (res.body || []).forEach(s => {
                    sel.append(`<option value="${s.specializationId}">${s.name}</option>`);
                });
            },
            error: function () { showAlert('Failed to load specializations.', 'error'); }
        });
    }
</script>
</body>
</html>
