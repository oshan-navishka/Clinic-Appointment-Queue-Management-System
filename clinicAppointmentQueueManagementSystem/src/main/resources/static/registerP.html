<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ClinicQ · Patient Register</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,400;14..32,500;14..32,600;14..32,700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <style>
        *{margin:0;padding:0;box-sizing:border-box}
        body{font-family:'Inter',sans-serif;background:#f4f9fe;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:1.5rem}
        .register-wrapper{width:100%;max-width:1200px;background:#fff;border-radius:40px;box-shadow:0 25px 50px -12px rgba(0,20,30,.25);display:flex;flex-wrap:wrap;overflow:hidden}
        .register-left{flex:1 1 40%;background:linear-gradient(145deg,#e1f0fa 0%,#c9e2f5 100%);padding:3rem 2.5rem;display:flex;flex-direction:column;justify-content:center;position:relative;min-height:400px}
        .register-left::after{content:'';position:absolute;bottom:0;left:0;width:100%;height:40%;background:url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 320"><path fill="%23ffffff" fill-opacity="0.25" d="M0,224L48,213.3C96,203,192,181,288,181.3C384,181,480,203,576,213.3C672,224,768,224,864,202.7C960,181,1056,139,1152,144C1248,149,1344,203,1392,229.3L1440,256L1440,320L1392,320C1344,320,1248,320,1152,320C1056,320,960,320,864,320C768,320,672,320,576,320C480,320,384,320,288,320C192,320,96,320,48,320L0,320Z"/></svg>') no-repeat bottom;background-size:cover;pointer-events:none}
        .logo-area{display:flex;align-items:center;gap:.75rem;margin-bottom:2rem;position:relative;z-index:2}
        .logo-icon{background:#1a4972;color:white;width:48px;height:48px;border-radius:16px;display:flex;align-items:center;justify-content:center;font-size:26px}
        .logo-text{font-weight:700;font-size:1.7rem;letter-spacing:-.5px;color:#0b2a44}
        .logo-text span{font-weight:400;color:#2b5a7a}
        .welcome-title{position:relative;z-index:2;margin-top:1.2rem}
        .welcome-title h1{font-size:2.5rem;font-weight:700;line-height:1.2;color:#0b2a44;margin-bottom:.75rem}
        .welcome-title p{font-size:1rem;color:#1e4a6b;max-width:360px;line-height:1.6;opacity:.85}
        .register-right{flex:1 1 60%;padding:2.5rem 2.8rem;display:flex;flex-direction:column;justify-content:center;background:white;overflow-y:auto}
        .register-header{margin-bottom:1.5rem}
        .register-header h2{font-size:1.8rem;font-weight:700;color:#0b2a44}
        .register-header p{color:#4c6f89;margin-top:.3rem;font-size:.95rem}
        .register-form{display:flex;flex-direction:column;gap:1rem}
        .form-row{display:grid;grid-template-columns:1fr 1fr;gap:1rem}
        .input-group{display:flex;flex-direction:column;gap:.3rem}
        .input-group label{font-weight:600;font-size:.85rem;color:#1e405b;display:flex;align-items:center;gap:.4rem}
        .input-group label i{color:#3d7aa3;font-size:.95rem}
        .input-field{display:flex;align-items:center;background:#f2f7fc;border-radius:16px;padding:.2rem 1rem;border:2px solid transparent;transition:.2s}
        .input-field:focus-within{border-color:#1f6e9c;background:white;box-shadow:0 4px 12px rgba(26,73,114,.08)}
        .input-field i{color:#658ba8;font-size:1rem;margin-right:.7rem;min-width:1rem}
        .input-field input{width:100%;padding:.8rem 0;border:none;background:transparent;font-size:.95rem;font-weight:500;color:#0b2a44;outline:none;font-family:'Inter',sans-serif}
        .input-field input::placeholder{color:#99b7cf;font-weight:400;font-size:.88rem}
        .password-toggle{cursor:pointer;color:#7f9fb9;transition:.2s;padding:.2rem;margin-left:.2rem}
        .password-toggle:hover{color:#1f6e9c}
        .register-btn{background:#0b2a44;color:white;border:none;padding:.95rem;border-radius:60px;font-weight:700;font-size:1.05rem;cursor:pointer;transition:.25s;display:flex;align-items:center;justify-content:center;gap:.6rem;margin-top:.4rem;box-shadow:0 6px 18px rgba(11,42,68,.2)}
        .register-btn:hover{background:#154a72;transform:scale(1.01)}
        .login-prompt{text-align:center;margin-top:1.4rem;font-size:.93rem;color:#3a607d}
        .login-prompt a{color:#0b2a44;font-weight:700;text-decoration:none;margin-left:.3rem;border-bottom:2px solid transparent;transition:.2s}
        .login-prompt a:hover{border-bottom-color:#0b2a44}
        .alert-box{padding:.8rem 1.2rem;border-radius:12px;font-size:.9rem;font-weight:500;display:none;margin-bottom:.5rem}
        .alert-error{background:#fde8e8;color:#b91c1c;border:1px solid #fca5a5}
        .alert-success{background:#d1fae5;color:#065f46;border:1px solid #6ee7b7}
        @media(max-width:820px){.register-wrapper{flex-direction:column;border-radius:32px}.form-row{grid-template-columns:1fr}}
    </style>
</head>
<body>
<div class="register-wrapper">
    <div class="register-left">
        <div class="logo-area">
            <div class="logo-icon"><i class="fas fa-heartbeat"></i></div>
            <div class="logo-text">Clinic<span>Q</span></div>
        </div>
        <div class="welcome-title">
            <h1>Create your account <i style="color:#1f6e9c;font-weight:300">·</i></h1>
            <p>Register as a patient and book appointments online. Quick and easy.</p>
        </div>
    </div>

    <div class="register-right">
        <div class="register-header">
            <h2>Patient Registration</h2>
            <p>Fill in your details to create your patient account.</p>
        </div>

        <div id="alertBox" class="alert-box"></div>

        <form class="register-form" onsubmit="handleRegister(); return false;">
            <!-- login credentials -->
            <div class="form-row">
                <div class="input-group">
                    <label><i class="fas fa-user-tag"></i> Username</label>
                    <div class="input-field">
                        <i class="fas fa-user-circle"></i>
                        <input type="text" id="username" placeholder="john_doe" required>
                    </div>
                </div>
                <div class="input-group">
                    <label><i class="fas fa-envelope"></i> Email</label>
                    <div class="input-field">
                        <i class="fas fa-envelope"></i>
                        <input type="email" id="userEmail" placeholder="john@example.com" required>
                    </div>
                </div>
            </div>

            <div class="input-group">
                <label><i class="fas fa-lock"></i> Password</label>
                <div class="input-field">
                    <i class="fas fa-key"></i>
                    <input type="password" id="password" placeholder="Min 6 characters" required>
                    <span class="password-toggle" id="togglePass"><i class="fas fa-eye-slash"></i></span>
                </div>
            </div>

            <!-- personal details -->
            <div class="form-row">
                <div class="input-group">
                    <label><i class="fas fa-id-card"></i> First Name</label>
                    <div class="input-field">
                        <i class="fas fa-user"></i>
                        <input type="text" id="firstName" placeholder="John" required>
                    </div>
                </div>
                <div class="input-group">
                    <label><i class="fas fa-id-card"></i> Last Name</label>
                    <div class="input-field">
                        <i class="fas fa-user"></i>
                        <input type="text" id="lastName" placeholder="Doe" required>
                    </div>
                </div>
            </div>

            <div class="form-row">
                <div class="input-group">
                    <label><i class="fas fa-phone"></i> Contact <span style="color:#dc2626">*</span></label>
                    <div class="input-field">
                        <i class="fas fa-mobile-alt"></i>
                        <input type="text" id="contact" placeholder="077 123 4567" required>
                    </div>
                </div>
                <div class="input-group">
                    <label><i class="fas fa-birthday-cake"></i> Age</label>
                    <div class="input-field">
                        <i class="fas fa-calendar"></i>
                        <input type="number" id="age" placeholder="25" min="1" max="120">
                    </div>
                </div>
            </div>

            <div class="input-group">
                <label><i class="fas fa-map-marker-alt"></i> Address <span style="color:#dc2626">*</span></label>
                <div class="input-field">
                    <i class="fas fa-home"></i>
                    <input type="text" id="address" placeholder="No. 10, Main St, Colombo" required>
                </div>
            </div>

            <div class="input-group">
                <label><i class="fas fa-phone-alt"></i> Emergency Contact <span style="color:#dc2626">*</span></label>
                <div class="input-field">
                    <i class="fas fa-ambulance"></i>
                    <input type="text" id="emergencyContact" placeholder="Name & phone — e.g. Jane Doe 071 234 5678" required>
                </div>
            </div>

            <button type="submit" class="register-btn" id="submitBtn">
                <i class="fas fa-user-plus"></i> Create Account
            </button>

            <div class="login-prompt">
                Already have an account? <a href="login.html">Sign in</a>
            </div>
        </form>
    </div>
</div>

<script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
<script>
    document.getElementById('togglePass').addEventListener('click', function () {
        const p = document.getElementById('password');
        const isPass = p.type === 'password';
        p.type = isPass ? 'text' : 'password';
        this.innerHTML = isPass ? '<i class="fas fa-eye"></i>' : '<i class="fas fa-eye-slash"></i>';
    });

    function showAlert(msg, type) {
        const box = document.getElementById('alertBox');
        box.textContent = msg;
        box.className = 'alert-box ' + (type === 'success' ? 'alert-success' : 'alert-error');
        box.style.display = 'block';
        setTimeout(() => box.style.display = 'none', 4000);
    }

    function handleRegister() {
        const username        = $('#username').val().trim();
        const userEmail       = $('#userEmail').val().trim();
        const password        = $('#password').val().trim();
        const firstName       = $('#firstName').val().trim();
        const lastName        = $('#lastName').val().trim();
        const contact         = $('#contact').val().trim();
        const age             = $('#age').val().trim();
        const address         = $('#address').val().trim();
        const emergencyContact = $('#emergencyContact').val().trim();

        if (!username || !userEmail || !password || !firstName || !lastName || !contact || !address || !emergencyContact) {
            showAlert('Please fill in all required fields.', 'error');
            return;
        }

        const btn = document.getElementById('submitBtn');
        btn.disabled = true;
        btn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Creating...';

        $.ajax({
            url: 'http://localhost:8080/api/patients/selfRegister',
            method: 'POST',
            contentType: 'application/json',
            data: JSON.stringify({
                username:         username,
                userEmail:        userEmail,
                password:         password,
                firstName:        firstName,
                lastName:         lastName,
                contact:          contact,
                age:              age ? parseInt(age) : null,
                address:          address,
                emergencyContact: emergencyContact
            }),
            success: function (res) {
                if (res.status === 0) {
                    showAlert('Account created! Redirecting to login...', 'success');
                    setTimeout(() => window.location.href = 'login.html', 1800);
                } else {
                    showAlert(res.message || 'Registration failed.', 'error');
                    btn.disabled = false;
                    btn.innerHTML = '<i class="fas fa-user-plus"></i> Create Account';
                }
            },
            error: function (xhr) {
                let msg = 'Registration failed. Please try again.';
                try { msg = JSON.parse(xhr.responseText).message || msg; } catch(e){}
                showAlert(msg, 'error');
                btn.disabled = false;
                btn.innerHTML = '<i class="fas fa-user-plus"></i> Create Account';
            }
        });
    }
</script>
</body>
</html>
