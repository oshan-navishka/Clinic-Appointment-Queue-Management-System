<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Clinic · login</title>
    <!-- Font & Icons -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,400;14..32,500;14..32,600;14..32,700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <style>
        /* ----- reset & base ----- */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', sans-serif;
            background: #f4f9fe;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 1.5rem;
        }

        /* ----- main card container ----- */
        .login-wrapper {
            width: 100%;
            max-width: 1200px;
            background: #ffffff;
            border-radius: 40px;
            box-shadow: 0 25px 50px -12px rgba(0, 20, 30, 0.25);
            display: flex;
            flex-wrap: wrap;
            overflow: hidden;
            transition: all 0.2s;
        }

        /* ----- left panel: visual / brand ----- */
        .login-left {
            flex: 1 1 50%;
            background: linear-gradient(145deg, #e1f0fa 0%, #c9e2f5 100%);
            padding: 3rem 2.5rem;
            display: flex;
            flex-direction: column;
            justify-content: center;
            position: relative;
            min-height: 400px;
        }

        .login-left::after {
            content: '';
            position: absolute;
            bottom: 0;
            left: 0;
            width: 100%;
            height: 40%;
            background: url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 320"><path fill="%23ffffff" fill-opacity="0.25" d="M0,224L48,213.3C96,203,192,181,288,181.3C384,181,480,203,576,213.3C672,224,768,224,864,202.7C960,181,1056,139,1152,144C1248,149,1344,203,1392,229.3L1440,256L1440,320L1392,320C1344,320,1248,320,1152,320C1056,320,960,320,864,320C768,320,672,320,576,320C480,320,384,320,288,320C192,320,96,320,48,320L0,320Z"/></svg>') no-repeat bottom;
            background-size: cover;
            pointer-events: none;
        }

        .logo-area {
            display: flex;
            align-items: center;
            gap: 0.75rem;
            margin-bottom: 2rem;
            position: relative;
            z-index: 2;
        }

        .logo-icon {
            background: #1a4972;
            color: white;
            width: 48px;
            height: 48px;
            border-radius: 16px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 26px;
            box-shadow: 0 8px 16px -6px rgba(18, 52, 77, 0.25);
        }

        .logo-text {
            font-weight: 700;
            font-size: 1.7rem;
            letter-spacing: -0.5px;
            color: #0b2a44;
        }

        .logo-text span {
            font-weight: 400;
            color: #2b5a7a;
        }

        .welcome-title {
            position: relative;
            z-index: 2;
            margin-top: 1.2rem;
        }

        .welcome-title h1 {
            font-size: 2.8rem;
            font-weight: 700;
            line-height: 1.2;
            color: #0b2a44;
            margin-bottom: 0.75rem;
        }

        .welcome-title h1 i {
            color: #1f6e9c;
            font-weight: 300;
        }

        .welcome-title p {
            font-size: 1.1rem;
            color: #1e4a6b;
            max-width: 380px;
            font-weight: 450;
            line-height: 1.6;
            opacity: 0.85;
        }

        .illustration {
            position: relative;
            z-index: 2;
            margin-top: 2.8rem;
            display: flex;
            align-items: center;
            gap: 0.5rem;
            flex-wrap: wrap;
        }

        .illustration i {
            font-size: 3.4rem;
            color: #1f6e9c;
            background: rgba(255, 255, 255, 0.6);
            padding: 0.8rem;
            border-radius: 30px;
            backdrop-filter: blur(2px);
            box-shadow: 0 8px 20px -12px rgba(0,0,0,0.1);
            margin-right: 0.5rem;
        }

        .illustration .badge-queue {
            background: white;
            padding: 0.5rem 1.2rem;
            border-radius: 60px;
            font-weight: 600;
            font-size: 0.9rem;
            color: #0b2a44;
            box-shadow: 0 4px 10px rgba(0,0,0,0.02);
            display: inline-flex;
            align-items: center;
            gap: 0.6rem;
        }

        .badge-queue i {
            font-size: 1rem;
            background: transparent;
            padding: 0;
            box-shadow: none;
        }

        /* ----- right panel: login form ----- */
        .login-right {
            flex: 1 1 50%;
            padding: 3rem 2.8rem;
            display: flex;
            flex-direction: column;
            justify-content: center;
            background: white;
        }

        .login-header {
            margin-bottom: 2.4rem;
        }

        .login-header h2 {
            font-size: 2rem;
            font-weight: 700;
            color: #0b2a44;
            letter-spacing: -0.3px;
        }

        .login-header p {
            color: #4c6f89;
            margin-top: 0.4rem;
            font-size: 0.98rem;
        }

        .login-form {
            display: flex;
            flex-direction: column;
            gap: 1.6rem;
        }

        .input-group {
            display: flex;
            flex-direction: column;
            gap: 0.4rem;
        }

        .input-group label {
            font-weight: 600;
            font-size: 0.9rem;
            color: #1e405b;
            letter-spacing: -0.2px;
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }

        .input-group label i {
            color: #3d7aa3;
            font-size: 1rem;
            width: 1.2rem;
        }

        .input-field {
            display: flex;
            align-items: center;
            background: #f2f7fc;
            border-radius: 20px;
            padding: 0.2rem 1.2rem;
            border: 2px solid transparent;
            transition: 0.2s;
        }

        .input-field:focus-within {
            border-color: #1f6e9c;
            background: white;
            box-shadow: 0 4px 12px rgba(26, 73, 114, 0.08);
        }

        .input-field i {
            color: #658ba8;
            font-size: 1.1rem;
            margin-right: 0.8rem;
        }

        .input-field input {
            width: 100%;
            padding: 1rem 0;
            border: none;
            background: transparent;
            font-size: 1rem;
            font-weight: 500;
            color: #0b2a44;
            outline: none;
            font-family: 'Inter', sans-serif;
        }

        .input-field input::placeholder {
            color: #99b7cf;
            font-weight: 400;
            font-size: 0.95rem;
        }

        .password-toggle {
            cursor: pointer;
            color: #7f9fb9;
            transition: 0.2s;
            padding: 0.2rem;
        }

        .password-toggle:hover {
            color: #1f6e9c;
        }

        .form-options {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-top: 0.4rem;
            flex-wrap: wrap;
            gap: 0.6rem;
        }

        .remember-me {
            display: flex;
            align-items: center;
            gap: 0.5rem;
            font-size: 0.9rem;
            color: #2c5779;
            font-weight: 500;
        }

        .remember-me input[type="checkbox"] {
            accent-color: #1f6e9c;
            width: 18px;
            height: 18px;
            border-radius: 6px;
            cursor: pointer;
        }

        .forgot-link {
            color: #1f6e9c;
            font-weight: 600;
            font-size: 0.9rem;
            text-decoration: none;
            transition: 0.2s;
            border-bottom: 1px solid transparent;
        }

        .forgot-link:hover {
            border-bottom-color: #1f6e9c;
            color: #0e4a72;
        }

        .login-btn {
            background: #0b2a44;
            color: white;
            border: none;
            padding: 1rem;
            border-radius: 60px;
            font-weight: 700;
            font-size: 1.1rem;
            cursor: pointer;
            transition: 0.25s;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 0.7rem;
            margin-top: 0.6rem;
            letter-spacing: 0.2px;
            box-shadow: 0 6px 18px rgba(11, 42, 68, 0.2);
        }

        .login-btn:hover {
            background: #154a72;
            transform: scale(1.01);
            box-shadow: 0 10px 24px rgba(11, 42, 68, 0.3);
        }

        .login-btn i {
            font-size: 1rem;
        }

        .signup-prompt {
            text-align: center;
            margin-top: 1.8rem;
            font-size: 0.95rem;
            color: #3a607d;
        }

        .signup-prompt a {
            color: #0b2a44;
            font-weight: 700;
            text-decoration: none;
            margin-left: 0.3rem;
            border-bottom: 2px solid transparent;
            transition: 0.2s;
        }

        .signup-prompt a:hover {
            border-bottom-color: #0b2a44;
        }

        /* ----- responsive tweaks ----- */
        @media (max-width: 820px) {
            .login-wrapper {
                flex-direction: column;
                border-radius: 32px;
            }
            .login-left {
                padding: 2.5rem 2rem;
                min-height: 280px;
            }
            .welcome-title h1 {
                font-size: 2.3rem;
            }
            .illustration {
                margin-top: 1.8rem;
            }
            .login-right {
                padding: 2.5rem 2rem;
            }
        }

        @media (max-width: 480px) {
            .login-left {
                padding: 2rem 1.5rem;
            }
            .login-right {
                padding: 2rem 1.5rem;
            }
            .welcome-title h1 {
                font-size: 1.9rem;
            }
            .logo-text {
                font-size: 1.4rem;
            }
            .form-options {
                flex-direction: column;
                align-items: flex-start;
            }
        }
    </style>
</head>
<body>
<div class="login-wrapper">
    <!-- left panel : brand & illustration -->
    <div class="login-left">
        <div class="logo-area">
            <div class="logo-icon">
                <i class="fas fa-heartbeat"></i>
            </div>
            <div class="logo-text">Clinic<span>Q</span></div>
        </div>
        <div class="welcome-title">
            <h1>Welcome back <i>·</i></h1>
            <p>Manage appointments & queues effortlessly. Secure access for staff and practitioners.</p>
        </div>
        <div class="illustration">
            <i class="fas fa-user-md"></i>
            <i class="fas fa-clipboard-list"></i>
            <span class="badge-queue">
          <i class="fas fa-people-arrows"></i>  Queue · 12
        </span>
            <span class="badge-queue" style="background: #d7e8f5; color:#124a6b;">
          <i class="fas fa-calendar-check"></i> Today
        </span>
        </div>
    </div>

    <!-- right panel : login form -->
    <div class="login-right">
        <div class="login-header">
            <h2>Sign in</h2>
            <p>Use your clinic credentials to continue</p>
        </div>

        <form class="login-form" onsubmit="handleLogin(); return false;">
            <!-- email / username -->
            <div class="input-group">
                <label for="username"><i class="fas fa-envelope"></i> Username</label>
                <div class="input-field">
                    <i class="fas fa-user-circle"></i>
                    <input type="text" id="username" placeholder="doctor">
                </div>
            </div>

            <!-- password -->
            <div class="input-group">
                <label for="password"><i class="fas fa-lock"></i> Password</label>
                <div class="input-field">
                    <i class="fas fa-key"></i>
                    <input type="password" id="password" placeholder="••••••••">
                    <span class="password-toggle" id="togglePass">
              <i class="fas fa-eye-slash"></i>
            </span>
                </div>
            </div>

            <!-- options row -->
            <div class="form-options">
                <label class="remember-me">
                    <input type="checkbox" checked> Remember me
                </label>
                <a href="#" class="forgot-link">Forgot password?</a>
            </div>

            <!-- login button -->
            <button type="submit" class="login-btn">
                <i class="fas fa-arrow-right-to-bracket"></i> Log in
            </button>

            <div class="signup-prompt">
                New to ClinicQ? <a href="register.html">Create account</a>
            </div>
        </form>
    </div>
</div>

<script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
<script>
    (function() {
        const toggle = document.getElementById('togglePass');
        const passwordField = document.getElementById('password');
        if (toggle && passwordField) {
            toggle.addEventListener('click', function() {
                const isPassword = passwordField.getAttribute('type') === 'password';
                passwordField.setAttribute('type', isPassword ? 'text' : 'password');
                this.innerHTML = isPassword ? '<i class="fas fa-eye"></i>' : '<i class="fas fa-eye-slash"></i>';
            });
        }
    })();

    function handleLogin() {
        let username = $('#username').val().trim();
        let password = $('#password').val().trim();

        if(!username || !password){
            alert('Please fill in all fields.');
            return;
        }

        const obj = JSON.stringify({
            "username": username,
            "password": password
        });

        $.ajax({
            url: "http://localhost:8080/api/users/login",
            method: "POST",
            contentType: "application/json",
            data: obj,
            success: function (response){
                alert(response.message || "Login successful!");
                window.location.href = "dashboard.html";
            },
            error: function (response){
                console.error("Error during login: ", response);
                alert("Login failed. Please check your credentials and try again.");
            }
        })

    }

</script>
</body>
</html>
